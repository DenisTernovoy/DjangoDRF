version: '3.9'

services:
  web:
    build: .
    command: >
        bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres
    env_file:
      - .env
    expose:
      - "5432"
    environment:
      - POSTGRES_PASSWORD=12345678910
      - POSTGRES_DB=djangorf
      - POSTGRES_USER=postgres
      - DB_HOST=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5
  redis:
    image: redis
    command: redis-server
    ports:
      - "6379:6379"
    depends_on:
      - db
  celery:
    build: .
    command: celery -A config worker -l INFO -P eventlet
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - db
  beat:
    build: .
    command: celery -A config beat -l info -S django
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
  static_volume: