services:
  web:
    build: .
    command: >
        bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
  db:
    image: postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - DB_HOST=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5
  redis:
    image: redis
    command: redis-server
    ports:
      - "6379:6379"
    depends_on:
      - db
  celery:
    build: .
    command: celery -A config worker -l INFO -P eventlet
    env_file:
      - .env
    depends_on:
      - redis
      - db
  beat:
    build: .
    command: celery -A config beat -l info -S django
    env_file:
      - .env
    depends_on:
      - redis
      - db

volumes:
  postgres_data: